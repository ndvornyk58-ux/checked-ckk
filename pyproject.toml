[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cookie-inspector-pro"
version = "0.1.0"
description = "Local cookie analysis, validation and session security audit platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13",
  "pydantic>=2.7,<3",
  "platformdirs>=4.0",
  "cryptography>=42",
  "keyring>=25",
  # Офлайн-копия Public Suffix List. Пакет выпускается часто; обновлять не раньше чем через 2 недели после релиза.
  "publicsuffixlist>=1.0",
]

[project.optional-dependencies]
# Подключаются по мере фаз; перечислены заранее, чтобы зафиксировать стек.
gui = ["PySide6>=6.7"]
export = ["openpyxl>=3.1", "reportlab>=4.0", "jinja2>=3.1"]
net = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-qt>=4.4", "import-linter>=2.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
cookie-inspector = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.infrastructure.db" = ["alembic.ini", "alembic/*.py", "alembic/versions/*.py", "alembic/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not perf'"
markers = [
  "perf: долгие тесты производительности (запускаются явно: -m perf)",
  "gui: тесты интерфейса (требуют PySide6, QT_QPA_PLATFORM=offscreen)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и докстрингах — норма для проекта

[tool.ruff.lint.per-file-ignores]
# В тестах: assert, тестовые «секреты», pickle собственных объектов, намеренный %-формат.
"tests/**" = ["S101", "S105", "S301", "UP031"]
# Автогенерированные миграции Alembic.
"app/infrastructure/db/alembic/versions/*" = ["E501", "W291", "I001"]

[tool.ruff.format]
exclude = ["app/infrastructure/db/alembic/versions/*"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
plugins = []

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.rules.*", "app.parsers.*", "app.services.*"]
strict = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Слои: зависимости направлены только вниз"
type = "layers"
layers = [
  "app.gui",
  "app.workers",
  "app.services",
  "app.infrastructure",
  "app.parsers",
  "app.rules",
  "app.domain",
]

[[tool.importlinter.contracts]]
name = "GUI не знает о БД и инфраструктуре"
type = "forbidden"
source_modules = ["app.gui"]
forbidden_modules = ["app.infrastructure", "sqlalchemy", "alembic"]

[[tool.importlinter.contracts]]
name = "Qt только в слое GUI"
type = "forbidden"
source_modules = ["app.domain", "app.rules", "app.parsers", "app.services", "app.infrastructure", "app.workers"]
forbidden_modules = ["PySide6"]

[[tool.importlinter.contracts]]
name = "Домен, правила и парсеры не зависят от хранилища"
type = "forbidden"
source_modules = ["app.domain", "app.rules", "app.parsers"]
forbidden_modules = ["sqlalchemy", "alembic"]
